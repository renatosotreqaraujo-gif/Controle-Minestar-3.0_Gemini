name: Compilar Executavel Windows

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Gerar Executavel
      run: |
        pyinstaller --noconfirm --onefile --name "Controle Minestar 3.0" --add-data "database.py;." app.py

    - name: Disponibilizar Build (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Sistema_Monitoramento_Mina
        path: dist/app
